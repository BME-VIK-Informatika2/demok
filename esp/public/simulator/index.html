<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Device simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            display: none;
        }

        #device {
            padding: 50px;
            position: relative;
            background: rgba(0, 0, 0, 0.75);
        }

        #device img {
            width: 200px;
            height: 200px;
        }

        #device canvas {
            width: 200px;
            position: absolute;
            left: 50px;
        }

        #sensor {
            max-width: 10px;
            flex-grow: 1;
            writing-mode: vertical-lr;
            direction: rtl
        }
    </style>
</head>
<body>
<nav class="bg-body-tertiary navbar navbar-expand-md navbar-light">
    <div class="container">
        <span class="navbar-brand" role="button">Device simulator</span>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex gap-2 mt-4">
        <div id="device" class="border rounded">
            <img src="esp.png" alt="esp device">
            <canvas></canvas>
        </div>
        <div class="border rounded d-flex flex-column align-items-center justify-content-between gap-2 p-2">
            <label for="sensor">Sensor</label>
            <input id="sensor" type="range" min="0" max="100" step="5" value="25">
            <span id="sensor-value">25%</span>
        </div>
    </div>
</div>

<script>
    window.onload = async function () {
        document.getElementById('sensor').addEventListener('change', function (event) {
            document.getElementById('sensor-value').innerText = `${event.target.value}%`;
            document.getElementById('device').style.background = `rgba(0, 0, 0, ${(100 - event.target.value) / 100})`;
            fetch(`status?value=${event.target.value}`, {method: 'POST'});
        });

        await updateStatus(true);

        setInterval(async function () {
            await updateStatus();
        }, 500);

        document.body.style.display = 'block';
    }

    async function updateStatus(withSensor = false) {
        const response = await fetch('status');
        if (!response.ok)
            return
        const json = await response.json();
        if (withSensor) {
            document.getElementById('sensor').value = json.sensor.value;
            document.getElementById('sensor-value').innerText = `${json.sensor.value}%`;
            document.getElementById('device').style.background = `rgba(0, 0, 0, ${(100 - json.sensor.value) / 100})`;
        }

        const canvas = document.querySelector('#device canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (json.led.state === 'on') {
            let radgrad = ctx.createRadialGradient(210, 70, 0, 210, 70, 30);
            radgrad.addColorStop(0, 'rgba(0,0,255,1)');
            radgrad.addColorStop(0.2, 'rgba(0,0,255,.9)');
            radgrad.addColorStop(1, 'rgba(0,0,255,0)');
            ctx.fillStyle = radgrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        if (json.rgb.state === 'on') {
            let radgrad = ctx.createRadialGradient(262, 40, 0, 262, 40, 40);
            radgrad.addColorStop(0, `rgba(${json.rgb.color.r},${json.rgb.color.g},${json.rgb.color.b},1)`);
            radgrad.addColorStop(0.2, `rgba(${json.rgb.color.r},${json.rgb.color.g},${json.rgb.color.b},.9)`);
            radgrad.addColorStop(1, `rgba(${json.rgb.color.r},${json.rgb.color.g},${json.rgb.color.b},0)`);
            ctx.fillStyle = radgrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }
</script>
</body>
</html>
