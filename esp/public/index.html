<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/styles.css"/>
    <title>Dashboard</title>
</head>
<body>
<p id="loading-message">Oldal betöltése ...</p>
<div id="dashboard">
    <div class="d-flex flex-column min-vh-100">

        <nav class="bg-body-tertiary navbar navbar-expand-md navbar-light">
            <div class="container">
                <span class="navbar-brand" role="button">Dashboard</span>
            </div>
        </nav>

        <main class="flex-grow-1">
            <div class="container">
                <div class="row">
                    <div class="col-12 col-sm-6">
                        <h2 class="border-bottom mt-4">
                            LED Light
                        </h2>
                        <div class="control-panel mb-4 btn-light-led" id="led-state-section">
                            <input type="radio" class="btn-check" value='off' name="led-state" id="led-state-off"
                                   autocomplete="off" checked>
                            <label class="btn btn-light btn-light-off" for="led-state-off">
                                <i class="bi bi-lightbulb"></i>
                            </label>

                            <input type="radio" class="btn-check" value='on' name="led-state" id="led-state-on"
                                   autocomplete="off">
                            <label class="btn btn-light btn-light-on" for="led-state-on">
                                <i class="bi bi-lightbulb-fill"></i>
                            </label>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <h2 class="border-bottom mt-4">
                            RGB Light
                        </h2>
                        <div class="control-panel mb-4 btn-light-rgb" id="rgb-state-section">
                            <input type="radio" class="btn-check" value='off' name="rgb-state" id="rgb-state-off"
                                   autocomplete="off" checked>
                            <label class="btn btn-light btn-light-off btn-outline-secondary" for="rgb-state-off">
                                <i class="bi bi-lightbulb"></i>
                            </label>

                            <input type="radio" class="btn-check" value='on' name="rgb-state" id="rgb-state-on"
                                   autocomplete="off">
                            <label class="btn btn-light btn-light-on btn-outline-warning" for="rgb-state-on">
                                <i class="bi bi-lightbulb-fill"></i>
                            </label>

                            <input type="color" class="form-control form-control-color ms-2" id="rgb-color" value="#FF0000">
                        </div>
                    </div>
                </div>



                <div class="border-bottom mt-4">
                    <div class="d-flex justify-content-between">
                        <h2>Photoresistor</h2>
                        <div class="d-flex align-items-baseline gap-2">
                            <label for="range-select">Range:</label>
                            <select class="form-select" id="range-select">
                                <option value="1">1 min</option>
                                <option value="5" selected>5 mins</option>
                                <option value="10">10 mins</option>
                                <option value="30">30 mins</option>
                            </select>
                            <label for="refresh-select">Refresh:</label>
                            <select class="form-select" id="refresh-select">
                                <option value="1">1 sec</option>
                                <option value="2" selected>2 sec</option>
                                <option value="5">5 sec</option>
                                <option value="0">Manual</option>
                            </select>
                            <button class="btn btn-outline-secondary" id="refresh-button">
                                <i class="bi bi-arrow-repeat"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mt-2 mb-4 monitor-panel" id="photo-state-section">
                    <div class="card">
                        <div class="card-body">
                            <canvas id="led-state-chart" class="chart-canvas"></canvas>
                        </div>
                    </div>
                </div>


            </div>
        </main>
        <footer class="py-4 text-center text-body-secondary bg-body-tertiary mt-4">Dashboard demo for <a
                class="link-body-emphasis"
                href="https://portal.vik.bme.hu/kepzes/targyak/VIAUAC10">BMEVIAUAC10</a></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/scripts.js"></script>
</body>
</html>
